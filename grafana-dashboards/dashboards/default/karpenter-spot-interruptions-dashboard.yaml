apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-karpenter-spot-interruptions
  namespace: default
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Kubernetes
data:
  karpenter-spot-interruptions.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Spot interruption signals + Karpenter provisioning / health. Designed for Prometheus + kube-state-metrics. Spot interruption metric names vary by setup, so panels use PromQL fallbacks (Karpenter interruption metrics OR AWS node-termination-handler metrics when present).",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "panels": [],
          "title": "Spot interruptions (signals)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "(\n  sum(increase(karpenter_interruption_received_total[$__range]))\n)\nor\n(\n  sum(increase(karpenter_interruptions_total[$__range]))\n)\nor\n(\n  sum(increase(aws_node_termination_handler_spot_interruption_received_total[$__range]))\n)\nor\n(\n  sum(increase(aws_node_termination_handler_spot_termination_received_total[$__range]))\n)",
              "refId": "A"
            }
          ],
          "title": "Spot interruption signals (selected range)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 0.01 },
                { "color": "red", "value": 0.05 }
              ] },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 18, "x": 6, "y": 1 },
          "id": 3,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "list", "placement": "bottom", "showLegend": false },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "(\n  sum(rate(karpenter_interruption_received_total[$__rate_interval]))\n)\nor\n(\n  sum(rate(karpenter_interruptions_total[$__rate_interval]))\n)\nor\n(\n  sum(rate(aws_node_termination_handler_spot_interruption_received_total[$__rate_interval]))\n)\nor\n(\n  sum(rate(aws_node_termination_handler_spot_termination_received_total[$__rate_interval]))\n)",
              "legendFormat": "interruptions/s",
              "refId": "A"
            }
          ],
          "title": "Spot interruption signal rate",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "mappings": [], "unit": "short", "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null },
              { "color": "orange", "value": 1 },
              { "color": "red", "value": 10 }
            ] } },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 5 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "count(\n  kube_node_labels{\n    label_karpenter_sh_capacity_type=\"spot\",\n    label_karpenter_sh_provisioner_name=~\"$provisioner\"\n  }\n)",
              "refId": "A"
            }
          ],
          "title": "Spot nodes (Karpenter-labeled)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "mappings": [], "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 9 },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "count(kube_node_labels{label_karpenter_sh_provisioner_name=~\"$provisioner\"})",
              "refId": "A"
            }
          ],
          "title": "Karpenter nodes (labeled)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "mappings": [], "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 9 },
          "id": 6,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(increase(kube_pod_status_unschedulable[$__range]))",
              "refId": "A"
            }
          ],
          "title": "Unschedulable pod samples (range)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "mappings": [], "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 9 },
          "id": 7,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(kube_pod_status_unschedulable[$__rate_interval]))",
              "refId": "A"
            }
          ],
          "title": "Unschedulable pods / s",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 13 },
          "id": 10,
          "panels": [],
          "title": "Karpenter health & control-plane signals",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "mappings": [], "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 14 },
          "id": 11,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(up{job=~\"karpenter|karpenter-controller|karpenter-operator|karpenter.*\"} == 1)",
              "refId": "A"
            }
          ],
          "title": "Karpenter targets up",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "mappings": [], "unit": "short", "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null },
            { "color": "orange", "value": 0.01 },
            { "color": "red", "value": 0.1 }
          ] } }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 14 },
          "id": 12,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(controller_runtime_reconcile_errors_total{job=~\"karpenter|karpenter-controller|karpenter-operator|karpenter.*\"}[$__rate_interval]))\nor\nsum(rate(karpenter_controller_runtime_reconcile_errors_total[$__rate_interval]))",
              "refId": "A"
            }
          ],
          "title": "Reconcile errors / s",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "mappings": [], "unit": "ops" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "id": 13,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (controller) (rate(controller_runtime_reconcile_total{job=~\"karpenter|karpenter-controller|karpenter-operator|karpenter.*\"}[$__rate_interval]))",
              "legendFormat": "{{controller}}",
              "refId": "A"
            }
          ],
          "title": "Reconcile throughput by controller",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "id": 20,
          "panels": [],
          "title": "Provisioning & scheduling",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "mappings": [], "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "id": 21,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "(\n  sum(increase(karpenter_nodeclaims_created_total[$__range]))\n)\nor\n(\n  sum(increase(karpenter_nodeclaims_created[$__range]))\n)",
              "legendFormat": "created",
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "(\n  sum(increase(karpenter_nodeclaims_terminated_total[$__range]))\n)\nor\n(\n  sum(increase(karpenter_nodeclaims_terminated[$__range]))\n)",
              "legendFormat": "terminated",
              "refId": "B"
            }
          ],
          "title": "NodeClaims created / terminated (range)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "mappings": [], "unit": "s", "thresholds": { "mode": "absolute", "steps": [
            { "color": "green", "value": null },
            { "color": "orange", "value": 10 },
            { "color": "red", "value": 30 }
          ] } }, "overrides": [] },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 23 },
          "id": 22,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum(rate(karpenter_provisioner_scheduling_duration_seconds_bucket[$__rate_interval])) by (le))\nor\nhistogram_quantile(0.99, sum(rate(karpenter_scheduling_duration_seconds_bucket[$__rate_interval])) by (le))",
              "legendFormat": "p99",
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(karpenter_provisioner_scheduling_duration_seconds_bucket[$__rate_interval])) by (le))\nor\nhistogram_quantile(0.95, sum(rate(karpenter_scheduling_duration_seconds_bucket[$__rate_interval])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            }
          ],
          "title": "Karpenter scheduling latency",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 31 },
          "id": 30,
          "panels": [],
          "title": "Cost (OpenCost metrics) — by Karpenter node labels",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "decimals": 2, "mappings": [], "unit": "currencyUSD" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 8, "x": 0, "y": 32 },
          "id": 31,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(\n  avg by (node) (node_total_hourly_cost)\n  * on(node) group_left(label_karpenter_sh_provisioner_name,label_karpenter_sh_capacity_type)\n    kube_node_labels{label_karpenter_sh_provisioner_name=~\"$provisioner\",label_karpenter_sh_capacity_type=~\"$capacity_type\"}\n)",
              "refId": "A"
            }
          ],
          "title": "Karpenter nodes hourly rate (USD/h)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "decimals": 2, "mappings": [], "unit": "currencyUSD" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 8, "x": 8, "y": 32 },
          "id": 32,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(\n  avg by (node) (node_total_hourly_cost)\n  * on(node) group_left(label_karpenter_sh_capacity_type)\n    kube_node_labels{label_karpenter_sh_capacity_type=\"spot\",label_karpenter_sh_provisioner_name=~\"$provisioner\"}\n)",
              "refId": "A"
            }
          ],
          "title": "Spot hourly rate (USD/h)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "decimals": 2, "mappings": [], "unit": "currencyUSD" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 8, "x": 16, "y": 32 },
          "id": 33,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(\n  avg by (node) (node_total_hourly_cost)\n  * on(node) group_left(label_karpenter_sh_capacity_type)\n    kube_node_labels{label_karpenter_sh_capacity_type=~\"on-demand|ondemand\",label_karpenter_sh_provisioner_name=~\"$provisioner\"}\n)",
              "refId": "A"
            }
          ],
          "title": "On-demand hourly rate (USD/h)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "decimals": 2, "mappings": [], "unit": "currencyUSD" }, "overrides": [] },
          "gridPos": { "h": 10, "w": 12, "x": 0, "y": 36 },
          "id": 34,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (label_karpenter_sh_capacity_type) (\n  avg by (node) (node_total_hourly_cost)\n  * on(node) group_left(label_karpenter_sh_capacity_type)\n    kube_node_labels{label_karpenter_sh_capacity_type=~\"$capacity_type\",label_karpenter_sh_provisioner_name=~\"$provisioner\"}\n)",
              "legendFormat": "{{label_karpenter_sh_capacity_type}}",
              "refId": "A"
            }
          ],
          "title": "Hourly rate by capacity type (USD/h)",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "decimals": 2, "mappings": [], "unit": "currencyUSD" }, "overrides": [] },
          "gridPos": { "h": 10, "w": 12, "x": 12, "y": 36 },
          "id": 35,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (label_karpenter_sh_provisioner_name) (\n  avg by (node) (node_total_hourly_cost)\n  * on(node) group_left(label_karpenter_sh_provisioner_name)\n    kube_node_labels{label_karpenter_sh_provisioner_name=~\"$provisioner\",label_karpenter_sh_capacity_type=~\"$capacity_type\"}\n)",
              "legendFormat": "{{label_karpenter_sh_provisioner_name}}",
              "refId": "A"
            }
          ],
          "title": "Hourly rate by provisioner (USD/h)",
          "type": "timeseries"
        }
      ],
      "refresh": false,
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["kubernetes", "karpenter", "spot", "aws"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": ".*", "value": ".*" },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(kube_node_labels{label_karpenter_sh_provisioner_name!=\"\"}, label_karpenter_sh_provisioner_name)",
            "hide": 0,
            "includeAll": true,
            "label": "Provisioner",
            "multi": true,
            "name": "provisioner",
            "options": [],
            "query": { "query": "label_values(kube_node_labels{label_karpenter_sh_provisioner_name!=\"\"}, label_karpenter_sh_provisioner_name)", "refId": "StandardVariableQuery" },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          },
          {
            "current": { "selected": false, "text": ".*", "value": ".*" },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(kube_node_labels{label_karpenter_sh_capacity_type!=\"\"}, label_karpenter_sh_capacity_type)",
            "hide": 0,
            "includeAll": true,
            "label": "Capacity type",
            "multi": true,
            "name": "capacity_type",
            "options": [],
            "query": { "query": "label_values(kube_node_labels{label_karpenter_sh_capacity_type!=\"\"}, label_karpenter_sh_capacity_type)", "refId": "StandardVariableQuery" },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "Karpenter + Spot Interruptions",
      "uid": "karpenter-spot-interruptions",
      "version": 1
    }
