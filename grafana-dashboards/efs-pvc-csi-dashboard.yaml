apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-efs-pvc-csi
  namespace: default
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Performance
data:
  efs-pvc-csi.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Amazon EFS on Kubernetes: CSI-identified PVCs/PVs, pods mounting PVCs, kubelet volume usage, D-state and iowait, kubelet storage operation latency, optional CSI workqueue and NFS client metrics.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "panels": [],
          "title": "EFS / PVC \u2014 summary",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "PVCs in selected namespaces whose bound PV matches csi_driver regex.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "count((kube_persistentvolumeclaim_info{namespace=~\"$namespace\"} * on(namespace, persistentvolumeclaim) group_left() kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=~\"$namespace\"}) * on(volumename) group_left(csi_driver, csi_volume_handle) label_replace(kube_persistentvolume_info{csi_driver=~\"$csi_driver\"}, \"volumename\", \"$1\", \"persistentvolume\", \"(.*)\")) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "EFS PVC count (CSI)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Non-bound phases from kube-state-metrics.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kube_persistentvolumeclaim_status_phase{namespace=~\"$namespace\",phase=~\"Pending|Lost\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "PVC Pending / Lost",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "node_exporter `node_processes_state`. High counts often correlate with stuck IO/NFS.",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 1
          },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(node_processes_state{state=\"D\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "D-state processes (cluster)",
          "type": "stat"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Often includes volume attach/mount delays (not EFS-specific).",
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "thresholds"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 1
          },
          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "textMode": "value_and_name"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kube_pod_container_status_waiting_reason{namespace=~\"$namespace\",reason=\"ContainerCreating\"}) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "Pods waiting (ContainerCreating)",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "id": 6,
          "panels": [],
          "title": "PVC & PV (CSI driver filter)",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "volumename is the PV name; csi_volume_handle is the EFS filesystem or access point ARN.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              },
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 6
          },
          "id": 7,
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "(kube_persistentvolumeclaim_info{namespace=~\"$namespace\"} * on(namespace, persistentvolumeclaim) group_left() kube_persistentvolumeclaim_resource_requests_storage_bytes{namespace=~\"$namespace\"}) * on(volumename) group_left(csi_driver, csi_volume_handle) label_replace(kube_persistentvolume_info{csi_driver=~\"$csi_driver\"}, \"volumename\", \"$1\", \"persistentvolume\", \"(.*)\")",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "EFS PVCs \u2014 request size & CSI volume handle",
          "type": "table",
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {},
                "renameByName": {}
              }
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 8,
          "panels": [],
          "title": "Pods using PVCs",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Which pods reference which PVCs (kube-state-metrics).",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "auto"
              },
              "mappings": []
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 17
          },
          "id": 9,
          "options": {
            "cellHeight": "sm",
            "showHeader": true
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kube_pod_spec_volumes_persistentvolumeclaims_info{namespace=~\"$namespace\",persistentvolumeclaim=~\"$pvc\"}",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Pod \u2192 volume \u2192 PVC",
          "type": "table",
          "transformations": [
            {
              "id": "labelsToFields",
              "options": {
                "mode": "columns"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "indexByName": {},
                "renameByName": {}
              }
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "id": 10,
          "panels": [],
          "title": "Kubelet volume metrics",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Per-node kubelet stats; duplicate series per node are normal during rollout.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "showPoints": "never"
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 27
          },
          "id": 11,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kubelet_volume_stats_used_bytes{namespace=~\"$namespace\",persistentvolumeclaim=~\"$pvc\"}",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}} @ {{node}}",
              "refId": "A"
            }
          ],
          "title": "PVC used bytes",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "showPoints": "never"
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 27
          },
          "id": 12,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kubelet_volume_stats_capacity_bytes{namespace=~\"$namespace\",persistentvolumeclaim=~\"$pvc\"}",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "refId": "A"
            }
          ],
          "title": "PVC capacity (kubelet)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Large file counts on EFS can stress metadata; tune if consistently high.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "showPoints": "never"
              },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 35
          },
          "id": 13,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "100 * kubelet_volume_stats_inodes_used{namespace=~\"$namespace\",persistentvolumeclaim=~\"$pvc\"} / clamp_min(kubelet_volume_stats_inodes{namespace=~\"$namespace\",persistentvolumeclaim=~\"$pvc\"}, 1)",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "refId": "A"
            }
          ],
          "title": "Inode use ratio",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "showPoints": "never"
              },
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 35
          },
          "id": 14,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kubelet_volume_stats_available_bytes{namespace=~\"$namespace\",persistentvolumeclaim=~\"$pvc\"}",
              "legendFormat": "{{namespace}}/{{persistentvolumeclaim}}",
              "refId": "A"
            }
          ],
          "title": "Available bytes",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 43
          },
          "id": 15,
          "panels": [],
          "title": "D-state & IO pressure (nodes)",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Requires node_exporter. Correlate with pods on the same node.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "showPoints": "never"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 44
          },
          "id": 16,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "node_processes_state{state=\"D\"}",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "title": "D-state process count by node",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "showPoints": "never"
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 44
          },
          "id": 17,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (instance) (rate(node_cpu_seconds_total{mode=\"iowait\"}[$__rate_interval]))",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "title": "CPU iowait by node",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 52
          },
          "id": 18,
          "panels": [],
          "title": "Kubelet storage operations (CSI)",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Series A filters EFS plugin; B shows all plugins if A is empty. From kubelet metrics.",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "showPoints": "never"
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 53
          },
          "id": 19,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le, operation_name, plugin_name) (rate(storage_operation_duration_seconds_bucket{plugin_name=~\".*efs.*\"}[$__rate_interval])))",
              "legendFormat": "{{operation_name}} / {{plugin_name}}",
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum by (le, operation_name, plugin_name) (rate(storage_operation_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "{{operation_name}} / {{plugin_name}} (all)",
              "refId": "B"
            }
          ],
          "title": "Storage op duration p99",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Operations per second (count/time).",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "showPoints": "never"
              },
              "unit": "ops"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 53
          },
          "id": 20,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (operation_name, plugin_name) (rate(storage_operation_duration_seconds_count{plugin_name=~\".*efs.*\"}[$__rate_interval]))",
              "legendFormat": "{{operation_name}} / {{plugin_name}}",
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "sum by (operation_name, plugin_name) (rate(storage_operation_duration_seconds_count[$__rate_interval]))",
              "legendFormat": "{{operation_name}} / {{plugin_name}} (all)",
              "refId": "B"
            }
          ],
          "title": "Storage operation throughput",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 61
          },
          "id": 21,
          "panels": [],
          "title": "CSI controller / sidecars (advanced)",
          "type": "row"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "description": "Set csi_job to match kube-prometheus ServiceMonitor job label for aws-efs-csi-driver (e.g. efs-csi-controller).",
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineInterpolation": "smooth",
                "showPoints": "never"
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 16,
            "x": 0,
            "y": 62
          },
          "id": 22,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (name, job) (workqueue_depth{job=~\"$csi_job\"})",
              "legendFormat": "{{job}} / {{name}}",
              "refId": "A"
            }
          ],
          "title": "Workqueue depth (CSI job regex)",
          "type": "timeseries"
        },
        {
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 62
          },
          "id": 23,
          "options": {
            "code": {
              "language": "plaintext",
              "showLineNumbers": false,
              "showMiniMap": false
            },
            "content": "**Prerequisites**\n\n- **kube-state-metrics**: PVC/PV/pod volume info (`kube_persistentvolume_info` with `csi_driver` / `csi_volume_handle`).\n- **Kubelet**: `kubelet_volume_stats_*`, `storage_operation_duration_seconds_*` (scrape kubelet or kube-prometheus kubelet relabel).\n- **node_exporter**: `node_processes_state{state=\"D\"}`, `node_cpu_seconds_total{mode=\"iowait\"}`; optional **NFS** collector for `node_nfs_*`.\n\n**EFS CSI**\n\n- Helm: enable **`node.volMetricsOptIn`** for richer per-volume metrics where supported.\n- Scrape **controller** pods for **csi-provisioner / resizer / snapshotter** sidecar metrics (`--http-endpoint` / `--metrics-address` per chart version).\n\n**Troubleshooting**\n\n- Sustained **D-state** + **iowait** on nodes running EFS-heavy workloads: check EFS throughput mode, burst credits, security groups (NFS **2049**), and AZ/region alignment.\n- **ContainerCreating**: investigate volume attach, CSI node plugin logs, and `storage_operation_duration_seconds` latency.",
            "mode": "markdown"
          },
