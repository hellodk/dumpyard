apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-pod-issues
  namespace: default
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Performance
data:
  pod-issues.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Kubernetes pod issue triage (restarts, OOM, pending, image pull, throttling, DNS). Uses kube-state-metrics + cAdvisor + CoreDNS metrics.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "panels": [],
          "title": "Pod Issues — quick triage",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 },
                { "color": "red", "value": 5 }
              ] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h]))",
              "refId": "A"
            }
          ],
          "title": "Restarts (last 1h)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 },
                { "color": "red", "value": 3 }
              ] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kube_pod_container_status_last_terminated_reason{namespace=~\"$namespace\",reason=\"OOMKilled\"})",
              "refId": "A"
            }
          ],
          "title": "Currently flagged as last OOMKilled",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 },
                { "color": "red", "value": 10 }
              ] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\",phase=\"Pending\"})",
              "refId": "A"
            }
          ],
          "title": "Pods Pending",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 },
                { "color": "red", "value": 10 }
              ] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(kube_pod_status_unschedulable{namespace=~\"$namespace\"})",
              "refId": "A"
            }
          ],
          "title": "Pods Unschedulable",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 10,
          "panels": [],
          "title": "Top offenders (tables)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "id": 11,
          "options": { "cellHeight": "sm", "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Value" }] },
          "fieldConfig": { "defaults": { "custom": { "align": "auto" }, "mappings": [] }, "overrides": [] },
          "targets": [
            {
              "editorMode": "code",
              "expr": "topk(20, increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[$__range]))",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Top restarts (over selected range)",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 6 },
          "id": 12,
          "options": { "cellHeight": "sm", "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Value" }] },
          "fieldConfig": { "defaults": { "custom": { "align": "auto" }, "mappings": [] }, "overrides": [] },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kube_pod_container_status_last_terminated_reason{namespace=~\"$namespace\",reason=\"OOMKilled\"} == 1",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Containers last terminated as OOMKilled",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 15 },
          "id": 13,
          "options": { "cellHeight": "sm", "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Value" }] },
          "fieldConfig": { "defaults": { "custom": { "align": "auto" }, "mappings": [] }, "overrides": [] },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kube_pod_container_status_waiting_reason{namespace=~\"$namespace\",reason=~\"CrashLoopBackOff|ImagePullBackOff|ErrImagePull\"} == 1",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Containers waiting (CrashLoop/ImagePull)",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 15 },
          "id": 14,
          "options": { "cellHeight": "sm", "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Value" }] },
          "fieldConfig": { "defaults": { "custom": { "align": "auto" }, "mappings": [] }, "overrides": [] },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kube_pod_status_phase{namespace=~\"$namespace\",phase=\"Pending\"} == 1",
              "format": "table",
              "instant": true,
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "kube_pod_status_unschedulable{namespace=~\"$namespace\"} == 1",
              "format": "table",
              "instant": true,
              "refId": "B"
            }
          ],
          "title": "Pods pending / unschedulable",
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 24 },
          "id": 20,
          "panels": [],
          "title": "CPU throttling (often causes timeouts)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 10 },
                { "color": "red", "value": 25 }
              ] },
              "unit": "percent"
            },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 25 },
          "id": 21,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "topk(20, 100 * sum by (namespace,pod,container) (rate(container_cpu_cfs_throttled_periods_total{namespace=~\"$namespace\",pod!=\"\",container!=\"\",container!=\"POD\"}[$__rate_interval])) / clamp_min(sum by (namespace,pod,container) (rate(container_cpu_cfs_periods_total{namespace=~\"$namespace\",pod!=\"\",container!=\"\",container!=\"POD\"}[$__rate_interval])), 0.001))",
              "legendFormat": "{{namespace}}/{{pod}}/{{container}}",
              "refId": "A"
            }
          ],
          "title": "Top CPU throttling % (containers)",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 33 },
          "id": 30,
          "panels": [],
          "title": "DNS / CoreDNS (common root cause for connection timeouts)",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 0.2 },
                  { "color": "red", "value": 0.5 }
                ]
              },
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 12, "x": 0, "y": 34 },
          "id": 33,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum(rate(coredns_dns_request_duration_seconds_bucket[$__rate_interval])) by (le))",
              "refId": "A"
            }
          ],
          "title": "DNS health: CoreDNS p99 latency",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "orange", "value": 1 },
                  { "color": "red", "value": 5 }
                ]
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 12, "x": 12, "y": 34 },
          "id": 34,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "orientation": "horizontal",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(coredns_dns_responses_total{rcode=~\"SERVFAIL|REFUSED\"}[$__rate_interval]))",
              "refId": "A"
            }
          ],
          "title": "DNS health: CoreDNS errors (SERVFAIL/REFUSED)",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "mappings": [], "unit": "s", "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null },
              { "color": "orange", "value": 0.2 },
              { "color": "red", "value": 0.5 }
            ] } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 38 },
          "id": 31,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "list", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.99, sum(rate(coredns_dns_request_duration_seconds_bucket[$__rate_interval])) by (le))",
              "legendFormat": "p99",
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "histogram_quantile(0.95, sum(rate(coredns_dns_request_duration_seconds_bucket[$__rate_interval])) by (le))",
              "legendFormat": "p95",
              "refId": "B"
            }
          ],
          "title": "CoreDNS request latency",
          "type": "timeseries"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "mappings": [], "unit": "reqps", "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null },
              { "color": "orange", "value": 1 },
              { "color": "red", "value": 5 }
            ] } },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 38 },
          "id": 32,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum(rate(coredns_dns_responses_total{rcode=~\"SERVFAIL|REFUSED\"}[$__rate_interval]))",
              "legendFormat": "SERVFAIL|REFUSED",
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "sum(rate(coredns_dns_responses_total{rcode=\"NXDOMAIN\"}[$__rate_interval]))",
              "legendFormat": "NXDOMAIN",
              "refId": "B"
            }
          ],
          "title": "CoreDNS error responses (cluster-wide)",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["kubernetes", "issues", "triage", "performance"],
      "templating": {
        "list": [
          {
            "current": { "selected": false, "text": ".*", "value": ".*" },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(kube_pod_info, namespace)",
            "hide": 0,
            "includeAll": true,
            "label": "Namespace",
            "multi": true,
            "name": "namespace",
            "options": [],
            "query": { "query": "label_values(kube_pod_info, namespace)", "refId": "StandardVariableQuery" },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "Kubernetes Pod Issues (OOM / CrashLoop / Pending / DNS / Throttling)",
      "uid": "k8s-pod-issues",
      "version": 1
    }
