            "type": "query"
          },
          {
            "current": { "selected": false, "text": ".*", "value": ".*" },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(kube_pod_info{namespace=\"$namespace\"}, pod)",
            "hide": 0,
            "includeAll": true,
            "label": "Pod",
            "multi": true,
            "name": "pod",
            "options": [],
            "query": { "query": "label_values(kube_pod_info{namespace=\"$namespace\"}, pod)", "refId": "StandardVariableQuery" },
            "refresh": 2,
            "regex": "",
            "sort": 1,
            "type": "query"
          },
          {
            "current": { "selected": false, "text": "1.2", "value": "1.2" },
            "hide": 0,
            "label": "CPU headroom multiplier",
            "name": "cpu_headroom",
            "options": [
              { "selected": true, "text": "1.2", "value": "1.2" },
              { "selected": false, "text": "1.3", "value": "1.3" },
              { "selected": false, "text": "1.5", "value": "1.5" }
            ],
            "query": "1.2,1.3,1.5",
            "type": "custom"
          },
          {
            "current": { "selected": false, "text": "1.2", "value": "1.2" },
            "hide": 0,
            "label": "Memory headroom multiplier",
            "name": "mem_headroom",
            "options": [
              { "selected": true, "text": "1.2", "value": "1.2" },
              { "selected": false, "text": "1.3", "value": "1.3" },
              { "selected": false, "text": "1.5", "value": "1.5" }
            ],
            "query": "1.2,1.3,1.5",
            "type": "custom"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
