              ] },
              { "matcher": { "id": "byName", "options": "cpu_usage_cores" }, "properties": [
                { "id": "unit", "value": "cores" },
                { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                { "id": "thresholds", "value": { "mode": "absolute", "steps": [
                  { "color": "#0EA5E933", "value": null },
                  { "color": "#06B6D455", "value": 0.01 },
                  { "color": "#8B5CF666", "value": 0.5 },
                  { "color": "#EC489977", "value": 1.5 }
                ] } }
              ] },
              { "matcher": { "id": "byName", "options": "cpu_limit_cores" }, "properties": [
                { "id": "unit", "value": "cores" },
                { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                { "id": "thresholds", "value": { "mode": "absolute", "steps": [
                  { "color": "#F59E0B44", "value": null }
                ] } }
              ] },
              { "matcher": { "id": "byName", "options": "cpu_over_provisioned_cores" }, "properties": [
                { "id": "unit", "value": "cores" },
                { "id": "custom.cellOptions", "value": { "type": "color-background" } },
                { "id": "thresholds", "value": { "mode": "absolute", "steps": [
                  { "color": "#10B98133", "value": null },
                  { "color": "#F59E0B55", "value": 0.1 },
                  { "color": "#EF444466", "value": 0.5 }
                ] } }
              ] },
              { "matcher": { "id": "byName", "options": "cpu_over_provisioned_percent_of_request" }, "properties": [
                { "id": "unit", "value": "percent" },
                { "id": "min", "value": 0 },
                { "id": "max", "value": 100 },
                { "id": "custom.cellOptions", "value": { "type": "gauge", "mode": "lcd", "valueDisplayMode": "color" } },
                { "id": "thresholds", "value": { "mode": "absolute", "steps": [
                  { "color": "#047857", "value": null },
                  { "color": "#84CC16", "value": 15 },
                  { "color": "#EAB308", "value": 30 },
                  { "color": "#EA580C", "value": 50 },
                  { "color": "#BE123C", "value": 70 }
                ] } }
              ] }
            ]
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[$__rate_interval]))",
              "format": "table",
              "instant": true,
              "legendFormat": "{{pod}}",
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\",pod=~\"$pod\",resource=\"cpu\",unit=\"core\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "{{pod}}",
              "refId": "B"
            },
            {
              "editorMode": "code",
              "expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=~\"$namespace\",pod=~\"$pod\",resource=\"cpu\",unit=\"core\"})",
              "format": "table",
              "instant": true,
              "legendFormat": "{{pod}}",
              "refId": "C"
            },
            {
              "editorMode": "code",
              "expr": "clamp_min(sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\",pod=~\"$pod\",resource=\"cpu\",unit=\"core\"}) - sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[$__rate_interval])), 0)",
              "format": "table",
              "instant": true,
              "legendFormat": "{{pod}}",
              "refId": "D"
            },
            {
              "editorMode": "code",
              "expr": "100 * clamp_min(sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\",pod=~\"$pod\",resource=\"cpu\",unit=\"core\"}) - sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"\",container!=\"POD\"}[$__rate_interval])), 0) / clamp_min(sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\",pod=~\"$pod\",resource=\"cpu\",unit=\"core\"}), 0.001)",
              "format": "table",
              "instant": true,
              "legendFormat": "{{pod}}",
              "refId": "E"
            }
          ],
          "transformations": [
            { "id": "joinByField", "options": { "byField": "pod", "mode": "outer" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true },
                "excludeByName": { "Time": true, "Value #B": true },
                "indexByName": { "pod": 0, "Value #A": 1, "Value #C": 2, "Value #D": 3, "Value #E": 4 },
                "renameByName": {
                  "Value #A": "cpu_usage_cores",
                  "Value #C": "cpu_limit_cores",
                  "Value #D": "cpu_over_provisioned_cores",
                  "Value #E": "cpu_over_provisioned_percent_of_request"
