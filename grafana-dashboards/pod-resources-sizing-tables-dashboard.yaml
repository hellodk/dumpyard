      "graphTooltip": 0,
      "id": null,
      "links": [],
      "description": "Vivid sizing tables: neon accents, pastel metric columns, gauges on over-provisioning & PVC fill.",
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "panels": [],
          "title": "Sizing tables — CPU / Memory / Volumes",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "cellHeight": "lg",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "frameIndex": 0,
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "cpu_usage_cores" }]
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": { "align": "auto", "cellOptions": { "type": "auto" }, "filterable": false, "inspect": false },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [{ "color": "rgba(0,0,0,0)", "value": null }] }
            },
            "overrides": [
              { "matcher": { "id": "byName", "options": "pod" }, "properties": [
                { "id": "color", "value": { "fixedColor": "#22D3EE", "mode": "fixed" } },
