apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-workload-health-rollouts
  namespace: default
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Performance
data:
  workload-health-rollouts.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "description": "Deployments, StatefulSets, DaemonSets, PDB, and HPA health from kube-state-metrics. See docs/workload-health-rollouts.md.",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "panels": [],
          "title": "Workload health — summary",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 },
                { "color": "red", "value": 3 }
              ] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 5, "x": 0, "y": 1 },
          "id": 2,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "count(kube_deployment_status_replicas_unavailable{namespace=~\"$namespace\"} > 0) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "Deployments w/ unavailable replicas",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 },
                { "color": "red", "value": 3 }
              ] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 5, "x": 5, "y": 1 },
          "id": 3,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "count((kube_statefulset_replicas{namespace=~\"$namespace\"} - kube_statefulset_status_replicas_ready{namespace=~\"$namespace\"}) > 0) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "StatefulSets not fully ready",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 },
                { "color": "red", "value": 2 }
              ] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 5, "x": 10, "y": 1 },
          "id": 4,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "count(kube_daemonset_status_number_unavailable{namespace=~\"$namespace\"} > 0) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "DaemonSets w/ unavailable pods",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 },
                { "color": "red", "value": 5 }
              ] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 5, "x": 15, "y": 1 },
          "id": 5,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "count((kube_poddisruptionbudget_status_pod_disruptions_allowed{namespace=~\"$namespace\"} == 0) and on (namespace, poddisruptionbudget) (kube_poddisruptionbudget_status_expected_pods{namespace=~\"$namespace\"} > 0)) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "PDBs w/ 0 disruptions allowed",
          "type": "stat"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "mappings": [],
              "thresholds": { "mode": "absolute", "steps": [
                { "color": "green", "value": null },
                { "color": "orange", "value": 1 },
                { "color": "red", "value": 5 }
              ] },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "id": 6,
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "value"
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "count((kube_horizontalpodautoscaler_status_current_replicas{namespace=~\"$namespace\"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace=~\"$namespace\"}) unless kube_horizontalpodautoscaler_spec_max_replicas{namespace=~\"$namespace\"} == 0) or vector(0)",
              "refId": "A"
            }
          ],
          "title": "HPAs at max replicas",
          "type": "stat"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 10,
          "panels": [],
          "title": "Detail — workloads needing attention",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 6 },
          "id": 11,
          "options": { "cellHeight": "sm", "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Value" }] },
          "fieldConfig": { "defaults": { "custom": { "align": "auto" }, "mappings": [] }, "overrides": [] },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kube_deployment_status_replicas_unavailable{namespace=~\"$namespace\"} > 0",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "Deployments — unavailable replicas > 0",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 6 },
          "id": 12,
          "options": { "cellHeight": "sm", "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Value" }] },
          "fieldConfig": { "defaults": { "custom": { "align": "auto" }, "mappings": [] }, "overrides": [] },
          "targets": [
            {
              "editorMode": "code",
              "expr": "(kube_statefulset_replicas{namespace=~\"$namespace\"} - kube_statefulset_status_replicas_ready{namespace=~\"$namespace\"}) > 0",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "StatefulSets — desired minus ready > 0",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 15 },
          "id": 13,
          "options": { "cellHeight": "sm", "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Value" }] },
          "fieldConfig": { "defaults": { "custom": { "align": "auto" }, "mappings": [] }, "overrides": [] },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kube_daemonset_status_number_unavailable{namespace=~\"$namespace\"} > 0",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "DaemonSets — unavailable pods > 0",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 15 },
          "id": 14,
          "options": { "cellHeight": "sm", "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Value" }] },
          "fieldConfig": { "defaults": { "custom": { "align": "auto" }, "mappings": [] }, "overrides": [] },
          "targets": [
            {
              "editorMode": "code",
              "expr": "(kube_poddisruptionbudget_status_pod_disruptions_allowed{namespace=~\"$namespace\"} == 0) and on (namespace, poddisruptionbudget) (kube_poddisruptionbudget_status_expected_pods{namespace=~\"$namespace\"} > 0)",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "PDBs — zero disruptions allowed (with expected pods)",
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 23 },
          "id": 20,
          "panels": [],
          "title": "HorizontalPodAutoscaler",
          "type": "row"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 24 },
          "id": 21,
          "options": { "cellHeight": "sm", "showHeader": true, "sortBy": [{ "desc": true, "displayName": "Value" }] },
          "fieldConfig": { "defaults": { "custom": { "align": "auto" }, "mappings": [] }, "overrides": [] },
          "targets": [
            {
              "editorMode": "code",
              "expr": "(kube_horizontalpodautoscaler_status_current_replicas{namespace=~\"$namespace\"} >= kube_horizontalpodautoscaler_spec_max_replicas{namespace=~\"$namespace\"}) unless kube_horizontalpodautoscaler_spec_max_replicas{namespace=~\"$namespace\"} == 0",
              "format": "table",
              "instant": true,
              "refId": "A"
            }
          ],
          "title": "HPAs at max replicas (cannot scale further)",
          "type": "table"
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "mappings": [], "unit": "short", "thresholds": { "mode": "absolute", "steps": [
              { "color": "green", "value": null }
            ] } },
            "overrides": []
          },
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 33 },
          "id": 22,
          "options": {
            "legend": { "calcs": ["lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "none" }
          },
          "targets": [
            {
              "editorMode": "code",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=~\"$namespace\"}",
              "legendFormat": "{{namespace}}/{{horizontalpodautoscaler}} current",
              "refId": "A"
            },
            {
              "editorMode": "code",
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=~\"$namespace\"}",
              "legendFormat": "{{namespace}}/{{horizontalpodautoscaler}} max",
              "refId": "B"
            }
          ],
          "title": "HPA current vs max replicas (trend)",
          "type": "timeseries"
        }
      ],
      "refresh": false,
      "schemaVersion": 39,
      "style": "dark",
      "tags": ["kubernetes", "workload", "rollout", "hpa", "pdb", "performance"],
      "templating": {
        "list": [
          {
            "allValue": ".*",
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(kube_pod_info, namespace)",
            "hide": 0,
            "includeAll": true,
            "label": "Namespace",
            "multi": true,
            "name": "namespace",
            "options": [],
            "query": { "query": "label_values(kube_pod_info, namespace)", "refId": "StandardVariableQuery" },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timezone": "browser",
      "title": "Kubernetes Workload Health & Rollouts",
      "uid": "k8s-workload-health-rollouts",
      "version": 1
    }
