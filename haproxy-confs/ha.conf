global
    log /dev/log local0
    maxconn 4096
    tune.ssl.default-dh-param 2048

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000
    timeout client  50000
    timeout server  50000

frontend avika_frontend
    bind *:80
    bind *:443 ssl crt /path/to/certs/gateway.pem alpn h2,http/1.1
    mode http

    # Redirect HTTP to HTTPS
    http-request redirect scheme https if !{ ssl_fc }

    # ACLs for identifying traffic types
    acl is_grpc hdr(content-type) -i application/grpc
    acl is_api path_beg /api/
    acl is_updates path_beg /updates/
    acl is_frontend_path path_beg /avika/

    # Routing rules
    use_backend gateway_grpc if is_grpc
    use_backend gateway_http if is_api || is_updates
    use_backend nextjs_frontend if is_frontend_path

    # Default fallback
    default_backend nextjs_frontend

backend nextjs_frontend
    mode http
    server frontend 127.0.0.1:3000 check

backend gateway_http
    mode http
    server gateway_http 127.0.0.1:5021 check

backend gateway_grpc
    mode http
    # gRPC requires HTTP/2 protocol to backend
    server gateway_grpc 127.0.0.1:5020 proto h2 check

