apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fizzy-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: nfs-client
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fizzy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fizzy
  template:
    metadata:
      labels:
        app: fizzy
    spec:
      containers:
        - name: fizzy
          image: ghcr.io/basecamp/fizzy:main
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: fizzy-storage
              mountPath: /rails/storage
      volumes:
        - name: fizzy-storage
          persistentVolumeClaim:
            claimName: fizzy-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fizzy
spec:
  selector:
    app: fizzy
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: ClusterIP
