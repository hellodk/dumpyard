---
apiVersion: v1
kind: ConfigMap
metadata:
  name: guac-user-mapping
  namespace: utilities
data:
  user-mapping.xml: |
    <user-mapping>
        <authorize username="admin" password="admin">
            <connection name="My SSH Server">
                <protocol>ssh</protocol>
                <param name="hostname">192.168.49.1</param>
                <param name="port">22</param>
                <param name="username">ubuntu</param>
            </connection>
        </authorize>
    </user-mapping>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacd
  namespace: utilities
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacd
  template:
    metadata:
      labels:
        app: guacd
    spec:
      containers:
        - name: guacd
          image: guacamole/guacd
          ports:
            - containerPort: 4822
---
apiVersion: v1
kind: Service
metadata:
  name: guacd
  namespace: utilities
spec:
  selector:
    app: guacd
  ports:
    - port: 4822
      targetPort: 4822
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: guacamole
  namespace: utilities
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guacamole
  template:
    metadata:
      labels:
        app: guacamole
    spec:
      containers:
        - name: guacamole
          image: guacamole/guacamole
          ports:
            - containerPort: 8080
          env:
            - name: GUACD_HOSTNAME
              value: guacd
            - name: GUACD_PORT
              value: "4822"
            - name: GUACAMOLE_HOME
              value: /guac
          volumeMounts:
            - name: guac-user-mapping
              mountPath: /guac
      volumes:
        - name: guac-user-mapping
          configMap:
            name: guac-user-mapping
---
apiVersion: v1
kind: Service
metadata:
  name: guacamole
  namespace: utilities
spec:
  type: NodePort
  selector:
    app: guacamole
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
