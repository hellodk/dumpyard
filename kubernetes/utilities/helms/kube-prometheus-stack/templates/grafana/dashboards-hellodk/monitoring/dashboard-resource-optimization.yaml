{{- /*
  Custom Dashboard: Kubernetes Resource Optimization
  Folder: Monitoring
  Description: Right-size CPU and Memory requests/limits based on actual usage
*/ -}}
{{- $kubeTargetVersion := default .Capabilities.KubeVersion.GitVersion .Values.kubeTargetVersionOverride }}
{{- if and (or .Values.grafana.enabled .Values.grafana.forceDeployDashboards) (semverCompare ">=1.14.0-0" $kubeTargetVersion) }}
apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ template "kube-prometheus-stack-grafana.namespace" . }}
  name: {{ printf "%s-%s" (include "kube-prometheus-stack.fullname" $) "dashboard-resource-optimization" | trunc 63 | trimSuffix "-" }}
  annotations:
    grafana_folder: "Monitoring"
    {{- with .Values.grafana.sidecar.dashboards.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  labels:
    {{- if $.Values.grafana.sidecar.dashboards.label }}
    {{ $.Values.grafana.sidecar.dashboards.label }}: {{ ternary $.Values.grafana.sidecar.dashboards.labelValue "1" (not (empty $.Values.grafana.sidecar.dashboards.labelValue)) | quote }}
    {{- end }}
    app: {{ template "kube-prometheus-stack.name" $ }}-grafana
    {{- include "kube-prometheus-stack.labels" $ | nindent 4 }}
data:
  resource-optimization.json: |-
{{ .Files.Get "dashboards-custom/resource-optimization.json" | indent 4 }}
{{- end }}
