apiVersion: core.k8sgpt.ai/v1alpha1
kind: K8sGPT
metadata:
  name: k8sgpt
  namespace: utilities
spec:
  repository: ghcr.io/k8sgpt-ai/k8sgpt
  version: v0.4.1
  integrations:
    trivy:
      enabled: true
      namespace: trivy-system
#    metrics:
#      enabled: true
#      namespace: monitoring
  ai:
    backend: customrest
    model: llama3
    baseUrl: "http://192.168.1.10:11434"
  noCache: true
