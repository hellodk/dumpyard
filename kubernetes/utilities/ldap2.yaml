    userPassword: {SSHA}TEpFKjfgBzoaN+XQAdWm7RHE0jWvDG3v

    ############################
    # User: billa
    ############################
    dn: uid=billa,ou=People,dc=hellodk,dc=io
    objectClass: inetOrgPerson
    cn: Billa Singh
    sn: Singh
    uid: billa
    mail: billa@hellodk.io
    userPassword: {SSHA}TEpFKjfgBzoaN+XQAdWm7RHE0jWvDG3v

    ############################
    # User: gunda
    ############################
    dn: uid=gunda,ou=People,dc=hellodk,dc=io
    objectClass: inetOrgPerson
    cn: Gunda Yadav
    sn: Yadav
    uid: gunda
    mail: gunda@hellodk.io
    userPassword: {SSHA}TEpFKjfgBzoaN+XQAdWm7RHE0jWvDG3v

    ############################
    # Group: admins
    ############################
    dn: cn=admins,ou=Groups,dc=hellodk,dc=io
