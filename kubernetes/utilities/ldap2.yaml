---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ldap
  namespace: utilities
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ldap
  template:
    metadata:
      labels:
        app: ldap
    spec:
      containers:
      - name: ldap
        image: osixia/openldap:1.5.0
        args: ["--copy-service", "--loglevel", "info"]
        ports:
        - containerPort: 389
        env:
        - name: LDAP_DOMAIN
          value: "hellodk.io"
        - name: LDAP_BASE_DN
          value: "dc=hellodk,dc=io"
        - name: LDAP_ADMIN_PASSWORD
          value: "Admin@123"
        volumeMounts:
        - name: ldap-data
          mountPath: /var/lib/ldap
        - name: ldap-config
          mountPath: /etc/ldap/slapd.d
        - name: bootstrap
          mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom/bootstrap.ldif
          subPath: bootstrap.ldif

      volumes:
      - name: ldap-data
        emptyDir: {}       # 👉 replace with PVC for production
      - name: ldap-config
        emptyDir: {}
      - name: bootstrap
        configMap:
          name: ldap-bootstrap


---

apiVersion: v1
kind: Service
metadata:
  name: ldap
  namespace: utilities
spec:
  selector:
    app: ldap
  ports:
  - port: 389
    targetPort: 389
