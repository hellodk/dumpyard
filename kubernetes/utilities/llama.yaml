apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          command: ["/bin/sh", "-c"]
          args: ["ollama serve"]
          ports:
            - containerPort: 11434
          volumeMounts:
            - name: ollama-models
              mountPath: /root/.ollama  # default model cache location
      volumes:
        - name: ollama-models
          emptyDir: {}  # or use hostPath/PVC if you want persistence

---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  type: NodePort  #

